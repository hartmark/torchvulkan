name: Setup torchvulkan toolchain
description: >
  Install the build/runtime toolchain for the current runner OS: the Slang
  compiler, the Vulkan headers + loader, and a Vulkan driver (on macOS, the
  MoltenVK release that gets bundled into the package). Exports the needed
  PATH / env entries so later steps in the job can build and run torchvulkan.
  Every download is checked against a pinned SHA-256; bump the hashes with the
  versions.

inputs:
  slang-version:
    description: Slang release version to install (the hashes below are for this version).
    default: "2026.8.1"
  vulkan-sdk-version:
    description: Vulkan SDK version (Windows only; the hash below is for this version).
    default: "1.3.296.0"
  validation-layers:
    description: Also install the Khronos validation layer (Linux only).
    default: "false"

runs:
  using: composite
  steps:
    - name: Resolve Slang arch
      shell: bash
      run: |
        case "${{ runner.os }}-${{ runner.arch }}" in
          Linux-X64)    echo "SLANG_ARCH=linux-x86_64"   >> "$GITHUB_ENV"; echo "SLANG_SHA256=0d018272522f6d2a75e2f92a30e8eddef18b92e80ab3d29575ac3b0136838aac" >> "$GITHUB_ENV" ;;
          macOS-ARM64)  echo "SLANG_ARCH=macos-aarch64"  >> "$GITHUB_ENV"; echo "SLANG_SHA256=d953efb713e76b220f1a4ff1e23a96b9f564657d1701de184e5a52059bc62310" >> "$GITHUB_ENV" ;;
          macOS-X64)    echo "SLANG_ARCH=macos-x86_64"   >> "$GITHUB_ENV"; echo "SLANG_SHA256=1ebce824ee9f757de3dbcc4a574b1ddb137136a086e0aaa77d928bbe073901fa" >> "$GITHUB_ENV" ;;
          Windows-X64)  echo "SLANG_ARCH=windows-x86_64" >> "$GITHUB_ENV"; echo "SLANG_SHA256=4cd6a06278b05433b09dfac3d733426e1e704967ca8529fc9e44f06deb5fcdd7" >> "$GITHUB_ENV" ;;
          *) echo "::error::Unsupported runner ${{ runner.os }}-${{ runner.arch }}"; exit 1 ;;
        esac

    - name: Install Slang (macOS & Linux)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        curl -sSLf -o slang.zip "https://github.com/shader-slang/slang/releases/download/v${{ inputs.slang-version }}/slang-${{ inputs.slang-version }}-${SLANG_ARCH}.zip"
        echo "${SLANG_SHA256}  slang.zip" | shasum -a 256 -c -
        unzip -q slang.zip -d "$RUNNER_TEMP/slang"
        echo "$RUNNER_TEMP/slang/bin" >> "$GITHUB_PATH"
        echo "SLANG_DIR=$RUNNER_TEMP/slang/bin" >> "$GITHUB_ENV"

    - name: Install Slang (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $zip = "slang-${{ inputs.slang-version }}-$env:SLANG_ARCH.zip"
        Invoke-WebRequest -Uri "https://github.com/shader-slang/slang/releases/download/v${{ inputs.slang-version }}/$zip" -OutFile $zip
        if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne $env:SLANG_SHA256) { throw "SHA-256 mismatch for $zip" }
        Expand-Archive -Path $zip -DestinationPath C:\slang
        "C:\slang\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
        "SLANG_DIR=C:\slang\bin" | Out-File -FilePath $env:GITHUB_ENV -Append

    - name: Install Vulkan (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libvulkan-dev mesa-vulkan-drivers
        if [ "${{ inputs.validation-layers }}" = "true" ]; then sudo apt-get install -y vulkan-validationlayers; fi

    - name: Install Vulkan (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install vulkan-headers vulkan-loader ninja
        bash .github/scripts/fetch-moltenvk-macos.sh
        echo "SKBUILD_CMAKE_DEFINE=TORCHVULKAN_MOLTENVK=/tmp/moltenvk/libMoltenVK.dylib" >> "$GITHUB_ENV"
        echo "MVK_CONFIG_USE_METAL_ARGUMENT_BUFFERS=0" >> "$GITHUB_ENV"

    - name: Install Vulkan (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        function Get-Verified($uri, $out, $sha256) {
          Invoke-WebRequest -Uri $uri -OutFile $out
          if ((Get-FileHash $out -Algorithm SHA256).Hash -ne $sha256) { throw "SHA-256 mismatch for $out" }
        }

        Get-Verified "https://github.com/pal1000/mesa-dist-win/releases/download/23.3.2/mesa3d-23.3.2-release-msvc.7z" "mesa.7z" "177422ca8985c29007fa6df775f6f72860a08f1d0d9da6c7b50aaddc72c957ba"
        7z x mesa.7z -omesa -y | Out-Null

        $lvpJson = (Resolve-Path "mesa\x64\lvp_icd.x86_64.json").Path
        $driverKey = "HKLM:\SOFTWARE\Khronos\Vulkan\Drivers"
        if (!(Test-Path $driverKey)) { New-Item -Path $driverKey -Force | Out-Null }
        New-ItemProperty -Path $driverKey -Name $lvpJson -PropertyType DWord -Value 0 -Force | Out-Null

        $sdkVersion = "${{ inputs.vulkan-sdk-version }}"
        $installer = "VulkanSDK-$sdkVersion-Installer.exe"
        Get-Verified "https://sdk.lunarg.com/sdk/download/$sdkVersion/windows/$installer" $installer "acb4ae0786fd3e558f8b3c36cc3eba91638984217ba8a6795ec64d2f9ffd8c4b"
        Start-Process -FilePath ".\$installer" -ArgumentList "--accept-licenses --default-answer --confirm-command install" -Wait -NoNewWindow

        "VULKAN_SDK=C:\VulkanSDK\$sdkVersion" | Out-File -FilePath $env:GITHUB_ENV -Append
        "C:\VulkanSDK\$sdkVersion\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append
